# Yummy Modern - modified derivative of the original theme.
# This file has been modified from the original project and is distributed
# under the Apache License, Version 2.0.

# 站点设置（演示站配置，使用模板前请按 README 改为自己的站点设置）
title: Yummy Modern 主题 # 例如：我的名字
name: Yummy Modern # 例如：DONGChuan
email: your_email@example.com # 例如：your_email@example.com
location: # 例如：Nice, France
company: # 例如：MyCompany
company_url: # 例如：https://example.com
github_url: https://github.com/zyraxi21/ # 例如：https://github.com/DONGChuan
github_username: # 填写后可运行 npm run fetch:projects 获取公开项目
github_orgs: [] # 可选组织名称
social_image: # 可选分享图片，例如 /assets/images/share.png
description: Yummy Modern 是基于原主题修改的现代化 Jekyll 和 Bootstrap 主题
favicon: favicon.png # 图片需位于 assets/images
repository: # 启用下面的 GitHub metadata 插件时，须填写 用户名/仓库名

# 站点主机与协议
# 使用模板前改为自己的域名；不要在 url 中重复添加 baseurl
url: https://zyraxi21.github.io

## Gem
plugins:
  - jekyll-paginate
  # - jekyll-github-metadata # 按需开启，并填写 repository

# 构建设置
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
permalink: /blog/:title.html

source: .
destination: ./_site

quiet: false
defaults: []

kramdown:
  input: GFM
  math_engine: null
  smart_quotes: apos,apos,quot,quot

# Disqus 评论，留空时不加载；填写后启用
disque:

# 分页
paginate: 10
paginate_path: 'page:num'

# 导航菜单
navs:
  - href: /
    label: 首页

  - href: /open-source
    label: 开源项目

  - href: /blog
    label: 博客

  - href: /bookmark
    label: 书签

  - href: /about
    label: 关于

# 侧边栏热门仓库数量
side_bar_repo_limit: 5 # 要显示的仓库数量

# 关于页面技能关键词，可自由修改
skill_software_keywords: [Java, C, C++, Qt, Python, MySQL, Oracle, SQLite, PL/SQL, 设计模式]
skill_j2ee_keywords: [Spring, Struct, Hibernet, MyBatis, JSP]
skill_web_keywords:
  [
    HTML,
    CSS,
    JS,
    JQuery,
    Ajax,
    AngularJS,
    NodeJS,
    ExpressJS,
    MongoDB,
    Redis,
    PHP,
    Symfony,
    Bootstrap,
  ]
skill_mobile_app_keywords: [Android, Sketch UI 设计]

layout: default
comments: true

# 通用部署与构建配置
lang: zh-Hans-CN
baseurl: '/Yummy-Modern' # 演示站子目录；使用模板前改为 /自己的仓库名，根目录部署填 ''
timezone: Asia/Shanghai
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - src
  - scripts
  - tests
  - docs
  - package.json
  - package-lock.json
  - eslint.config.mjs
  - README.md
  - CHANGES.md
  - dump.html
  - fetched-page.html
  - fetched-page2.html
