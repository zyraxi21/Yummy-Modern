<footer class='container'>
  <div class='site-footer'>
    <div class='copyright float-start'>
      <!-- 请不要更改这一行 方便其他人知道模板的来源 谢谢 -->
      <!-- 这是基于原模板修改并依据 Apache License 2.0 分发的衍生作品。 -->
      模板来自
      <a href='https://github.com/DONGChuan/Yummy-Jekyll' target='_blank' rel='noopener noreferrer'
        >Yummy Jekyll</a
      >。
    </div>

    <a
      class='footer-github-link'
      href='https://zyraxi21.github.io/'
      target='_blank'
      rel='noopener noreferrer'
      aria-label='访问网站'
      title='访问网站'
    >
      <svg
        class='mega-octicon octicon footer-github-icon'
        width='24'
        height='24'
        aria-hidden='true'
      >
        <use href="{{ '/assets/vendor/octicons.svg' | relative_url }}#icon-mark-github"></use>
      </svg>
    </a>

    <div class='float-end'>
      <a href='#top' data-back-to-top>回到顶部</a>
    </div>
  </div>

  {% for javascript in page.javascript %}
    <script defer src='{{ '/assets/js/' | append: javascript | relative_url }}'></script>
  {% endfor %}
</footer>
